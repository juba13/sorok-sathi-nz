<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সড়কসাথী NZ</title>
<meta name="description" content="Unofficial Bangla–English study guide to the NZ Road Code. সড়কসাথী NZ — NZ Road Code-এর অনানুষ্ঠানিক বাংলা study guide.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#5b6478;--line:#e3e6ee;--pri:#0b5cad;--pri2:#e8f1fb;--ok:#1f8a4c;--okbg:#e9f7ef;--warn:#b54708;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdecea;--tip:#6941c6;--tipbg:#f3efff}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Kohinoor Bangla","Hind Siliguri",-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px}
header{background:linear-gradient(135deg,#0b5cad,#063a70);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:19px;font-weight:700}
header .sub{font-size:13px;opacity:.85}
.hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
#search{padding:8px 12px;border-radius:8px;border:0;min-width:240px;font-size:15px;font-family:inherit}
nav#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:15}
nav#tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink)}
nav#tabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:18px;max-width:1250px;margin:0 auto;padding:18px}
aside{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
aside h3{margin:4px 6px 8px;font-size:14px;color:var(--mute)}
aside a{display:block;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
aside a:hover{background:var(--pri2)}
aside a .n{color:var(--pri);font-weight:700;margin-right:6px}
aside a.done{color:var(--ok)}
aside a.done::after{content:" ✓"}
.prog{font-size:13px;color:var(--mute);margin:8px 6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 6px 8px}
.bar i{display:block;height:100%;background:var(--ok)}
main{min-width:0}
main h2{margin:0 0 4px;font-size:24px}
main .intro{color:var(--mute);margin-bottom:12px}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:13px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;scroll-margin-top:130px}
details.sec>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:17px;list-style:none;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--pri);transition:.15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary .n{background:var(--pri2);color:var(--pri);border-radius:6px;padding:0 8px;font-size:14px}
.body{padding:0 18px 14px}
.body h4{margin:14px 0 4px;font-size:16px;color:var(--pri)}
.body ul,.body ol{padding-left:22px;margin:6px 0}
.body li{margin:3px 0}
b.en,.en{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
.box{border-radius:10px;padding:10px 14px;margin:10px 0;border-left:4px solid}
.rule{background:var(--pri2);border-color:var(--pri)}
.rule::before{content:"📜 Rule / নিয়ম";display:block;font-weight:700;font-size:13px;color:var(--pri)}
.tip{background:var(--tipbg);border-color:var(--tip)}
.tip::before{content:"🎯 Exam Tip";display:block;font-weight:700;font-size:13px;color:var(--tip)}
.ex{background:var(--okbg);border-color:var(--ok)}
.ex::before{content:"💡 Example / উদাহরণ";display:block;font-weight:700;font-size:13px;color:var(--ok)}
.warn{background:var(--warnbg);border-color:var(--warn)}
.warn::before{content:"⚠️ সাবধান";display:block;font-weight:700;font-size:13px;color:var(--warn)}
.src{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:auto;white-space:nowrap}
.src.eb{background:#fff1e6;color:#b54708}
.src.rc{background:#e6f4ea;color:#1f8a4c}
.src.dr{background:#e8f1fb;color:#0b5cad}
.src.dn{background:#f3efff;color:#6941c6}
.srcs{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mem{background:#fffbe6;border:1px solid #f5d76e;border-radius:10px;padding:9px 13px;margin:10px 0;font-size:15px}
.memline{background:#fffbe6;border-left:4px solid #e0b100;border-radius:8px;padding:7px 12px;margin:12px 0 6px;font-weight:600}
.memline::before{content:"🧠 মনে রাখুন: ";color:#9a7400}
.mem-inline{background:#fffbe6;border-radius:6px;padding:0 6px;font-weight:600}
.refs{font-size:13px;color:var(--mute);margin-top:6px}
.refs a,.refs span{color:var(--pri);margin-right:10px;white-space:nowrap}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.numgrid div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.numgrid b{display:block;font-size:19px;color:var(--pri)}
.numgrid span{font-size:12.5px;color:var(--mute)}
.rev h4{margin:14px 0 4px}
.rev li{margin:2px 0}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-family:inherit;background:#fff}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#f0f3f9}
.steps{counter-reset:s;list-style:none;padding-left:0}
.steps li{counter-increment:s;padding-left:34px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.markread{margin-top:8px;font-size:14px;color:var(--mute)}
mark{background:#ffe58a;padding:0 2px}
/* signs */
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.sign{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px}
.sign .g{height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.oct{width:58px;height:58px;background:#c8102e;color:#fff;font:700 13px sans-serif;display:flex;align-items:center;justify-content:center;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.tri{width:0;height:0;border-left:32px solid transparent;border-right:32px solid transparent;border-top:56px solid #c8102e;position:relative}
.tri::after{content:"";position:absolute;left:-20px;top:-50px;border-left:20px solid transparent;border-right:20px solid transparent;border-top:34px solid #fff}
.circ{width:58px;height:58px;border-radius:50%;border:7px solid #c8102e;background:#fff;display:flex;align-items:center;justify-content:center;font:700 18px sans-serif}
.dia{width:46px;height:46px;transform:rotate(45deg);background:#ffd100;border:3px solid #111;display:flex;align-items:center;justify-content:center}
.dia span{transform:rotate(-45deg);font:700 11px sans-serif}
.dia.or{background:#ff8c1a}
.rect{width:80px;height:50px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px sans-serif}
/* quiz */
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.q .qt{font-weight:700}
.q label{display:block;padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.q label.right{background:var(--okbg);border-color:var(--ok)}
.q label.wrong{background:var(--badbg);border-color:var(--bad)}
.q .exp{display:none;margin-top:6px;font-size:15px;color:var(--mute)}
.q.answered .exp{display:block}
.score{position:sticky;top:120px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:700;z-index:5}
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fc{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:110px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600}
.fc.flip{background:var(--pri2)}
.note{font-size:13px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:16px}
.figs{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.figs figure{margin:0;flex:1 1 220px;max-width:340px;background:#fafbfd;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.figs img{width:100%;height:190px;object-fit:contain;background:#fff;display:block;cursor:zoom-in}
.figs figcaption{font-size:13px;color:var(--mute);padding:5px 9px}
.signs img{height:70px;max-width:100%;object-fit:contain;display:block;margin:0 auto 6px;cursor:zoom-in}
#zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;cursor:zoom-out}
#zoom div{max-width:92vw;text-align:center;color:#fff}
#zoom img{max-width:92vw;max-height:82vh;border-radius:8px;background:#fff}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
@media print{header,nav#tabs,aside,.tools{display:none}.wrap{display:block}details.sec{break-inside:avoid}}

.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.lang button.on{background:#fff;color:var(--pri);font-weight:700}
.hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{background:#fff4e5;border-bottom:1px solid #f5c58a;color:#7a3e00;font-size:13.5px;padding:7px 18px;text-align:center}
.banner a{color:#7a3e00;font-weight:700}
footer{max-width:1250px;margin:10px auto 30px;padding:12px 18px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);text-align:center}
.watch{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;height:190px;background:#e8f1fb;text-decoration:none;color:var(--pri);font-weight:700;padding:10px;text-align:center}
.watch small{font-weight:400;color:var(--mute);font-size:12px}
.toc>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mute);padding:4px 6px;list-style:none}
body[data-lang=en] .rule::before{content:"📜 Rule"}
body[data-lang=en] .tip::before{content:"🎯 Exam tip"}
body[data-lang=en] .ex::before{content:"💡 Example"}
body[data-lang=en] .warn::before{content:"⚠️ Caution"}
body[data-lang=en] .memline::before{content:"🧠 Remember: "}
@media(max-width:860px){
 header{position:static;padding:12px 14px}
 header h1{font-size:17px}
 #search{min-width:0;width:100%}
 .hright{width:100%}
 nav#tabs{top:0}
 .wrap{padding:10px;gap:10px}
 aside{position:static;max-height:none}
 .body{padding:0 12px 12px}
 details.sec>summary{font-size:16px;padding:11px 12px;flex-wrap:wrap}
 .srcs{margin-left:0;width:100%;justify-content:flex-start}
 .body table{display:block;overflow-x:auto;font-size:14px}
 .figs figure{max-width:100%;flex:1 1 100%}
 main,aside{min-width:0}
 .wrap{grid-template-columns:minmax(0,1fr)}
 .q label{word-break:break-word}
 main h2{font-size:21px}
 .score{top:52px}
}
</style>
</head>
<body data-lang="bn">
<header>
  <div class="hrow">
    <div>
      <h1>🇳🇿 সড়কসাথী NZ <span style="font-weight:400;opacity:.85">· SorokSathi NZ</span></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="hright">
      <input id="search" type="search">
      <div class="lang" role="group" aria-label="Language"><button data-l="bn">বাংলা</button><button data-l="en">English</button></div>
    </div>
  </div>
</header>
<div class="banner" id="banner"></div>
<nav id="tabs"></nav>
<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<footer id="footer"></footer>
<div id="zoom" onclick="this.style.display='none'"><div><img alt=""><p></p></div></div>
<script src="data.js"></script>
<script src="i18n/en-1.js"></script>
<script src="i18n/en-2.js"></script>
<script src="i18n/en-3.js"></script>
<script src="extra.js"></script>
<script>
const SRCNAME={RC:['rc','Road Code'],DR:['dr','Drive'],DN:['dn','Driving in NZ'],EB:['eb','eBook']};
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let read=store.get('nzrc_read2',{});
let lang=store.get('nzrc_lang',null)||((navigator.language||'').startsWith('bn')?'bn':'bn');
let cur=DATA[0].id;
const U=k=>UI[lang][k];
const imgSrc=f=>(typeof IMG!=='undefined'&&IMG[f])||('img/'+f);
const isMobile=()=>window.matchMedia('(max-width:860px)').matches;
function TT(t){const e=lang==='en'&&EN.tabs[t.id];return {title:e?e.title:t.title,intro:e?e.intro:t.intro}}
function SS(s){const e=lang==='en'&&EN.subs[s.n];if(!e)return s;const img=s.img?s.img.map(([f,c],i)=>[f,(e.cap&&e.cap[i])||c]):s.img;return Object.assign({},s,{t:e.t||s.t,h:e.h||s.h,mem:s.mem?(e.mem||s.mem):undefined,img})}
function QZ(){return lang==='en'&&EN.quiz?QUIZ.map((q,i)=>[EN.quiz[i][0],EN.quiz[i][1],q[2],EN.quiz[i][2]]):QUIZ}
function FL(){return lang==='en'&&EN.flash?EN.flash:FLASH}
function totalSubs(){return DATA.reduce((a,t)=>a+t.subs.length,0)}
function badges(src){if(!src)return '';return '<span class="srcs">'+src.split(' ').map(k=>SRCNAME[k]?`<span class="src ${SRCNAME[k][0]}">${SRCNAME[k][1]}</span>`:'').join('')+'</span>'}
function figs(a){if(!a||!a.length)return '';return '<div class="figs">'+a.map(([f,c])=>{
  if(f.startsWith('drive-'))return `<figure><a class="watch" href="https://drive.govt.nz/restricted-licence/skills/${DRIVE_PAGE[f]||''}" target="_blank" rel="noopener">${U('watch')}<small>${c.replace(/^Drive animation:\s*/,'')}</small></a><figcaption>${U('watchnote')}</figcaption></figure>`;
  return `<figure><img loading="lazy" src="${imgSrc(f)}" alt="${c}" onclick="zoom(this)"><figcaption>${c}</figcaption></figure>`}).join('')+'</div>'}
function refs(r){if(!r||!r.length)return '';return `<div class="refs">${U('source')}`+r.map(([u,l])=>u?`<a href="${u}" target="_blank" rel="noopener">${l}</a>`:`<span>${l}</span>`).join('')+'</div>'}
function secHTML(s0,open){
  const s=SS(s0),id='s-'+s.n.replace('.','-');
  return `<details class="sec" id="${id}" ${open?'open':''}><summary><span class="n">${s.n}</span>${s.t}${badges(s.src)}</summary><div class="body">${figs(s.img)}${s.h}${s.mem?`<div class="memline">${s.mem}</div>`:''}${refs(s.ref)}
  <label class="markread"><input type="checkbox" data-k="${s.n}" ${read[s.n]?'checked':''}> ${U('read')}</label></div></details>`;
}
function chrome(){
  document.body.dataset.lang=lang;document.documentElement.lang=lang;
  $('#subtitle').textContent=U('sub');$('#search').placeholder=U('search');
  $('#banner').innerHTML=`⚖️ ${U('banner')} <a href="#s-1-0" onclick="cur='start';render();setTimeout(()=>{const e=document.getElementById('s-1-0');e.open=true;e.scrollIntoView()},50);return false">${U('more')}</a>`;
  $('#footer').innerHTML=`${lang==='en'?APP.name_en:APP.name_bn} · ${U('footer')}${APP.checked} · <a href="https://www.nzta.govt.nz/roadcode" target="_blank" rel="noopener">Official NZ Road Code</a>`;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
}
function renderTabs(){
  $('#tabs').innerHTML=DATA.map(t=>`<button data-id="${t.id}" class="${t.id===cur?'active':''}">${t.icon} ${TT(t).title}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.id;$('#search').value='';render();window.scrollTo(0,0)});
  const a=$('#tabs .active');if(a)a.scrollIntoView({inline:'center',block:'nearest'});
}
function renderSide(list,title){
  const done=Object.values(read).filter(Boolean).length,tot=totalSubs();
  $('#side').innerHTML=`<details class="toc" ${isMobile()?'':'open'}><summary>📑 ${title}</summary>`+list.map(s0=>{const s=SS(s0);return `<a href="#s-${s.n.replace('.','-')}" class="${read[s.n]?'done':''}"><span class="n">${s.n}</span>${s.t}</a>`}).join('')+
  `</details><div class="prog">${U('progress')}: ${done}/${tot}</div><div class="bar"><i style="width:${Math.round(done*100/tot)}%"></i></div>`;
  document.querySelectorAll('#side a').forEach(a=>a.onclick=()=>{const el=document.querySelector(a.getAttribute('href'));if(el)el.open=true;});
}
function bindRead(){
  document.querySelectorAll('input[data-k]').forEach(c=>c.onchange=()=>{read[c.dataset.k]=c.checked;store.set('nzrc_read2',read);
    const q=$('#search').value.trim();if(!q){const t=DATA.find(t=>t.id===cur);renderSide(t.subs,t.icon+' '+TT(t).title)}else doSearch(q);});
}
function after(){buildFlash();buildQuiz();buildRevision()}
function render(){
  chrome();renderTabs();
  const t=DATA.find(x=>x.id===cur),tt=TT(t);
  $('#main').innerHTML=`<h2>${t.icon} ${tt.title}</h2><div class="intro">${tt.intro}</div>
  <div class="tools"><button onclick="toggleAll(true)">${U('open')}</button><button onclick="toggleAll(false)">${U('close')}</button><button onclick="window.print()">${U('print')}</button></div>`+
  t.subs.map((s,i)=>secHTML(s,i===0)).join('');
  renderSide(t.subs,t.icon+' '+tt.title);bindRead();after();
}
function toggleAll(v){document.querySelectorAll('details.sec').forEach(d=>d.open=v)}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.toLowerCase()}
function doSearch(q){
  chrome();
  const ql=q.toLowerCase(),hits=[];
  DATA.forEach(t=>t.subs.forEach(s0=>{const s=SS(s0);if((s.t+' '+(s.mem||'')+' '+strip(s.h)).toLowerCase().includes(ql))hits.push([t,s0])}));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  $('#main').innerHTML=`<h2>🔍 "${q.replace(/</g,'&lt;')}" — ${hits.length}${U('results')}</h2>`+
   hits.map(([t,s])=>`<div style="font-size:13px;color:var(--mute);margin:2px 4px">${t.icon} ${TT(t).title}</div>`+secHTML(s,true)).join('');
  renderSide(hits.map(h=>h[1]),U('sresults'));bindRead();highlight(q);after();
}
function highlight(q){
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  document.querySelectorAll('#main .body').forEach(b=>{
    const w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{re.lastIndex=0;if(re.test(n.nodeValue)){const s=document.createElement('span');s.innerHTML=n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(re,m=>`<mark>${m}</mark>`);n.replaceWith(s);}});
  });
}
let st;$('#search').addEventListener('input',e=>{clearTimeout(st);const q=e.target.value.trim();st=setTimeout(()=>{q.length>=2?doSearch(q):render()},200)});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('nzrc_lang',lang);const q=$('#search').value.trim();q.length>=2?doSearch(q):render()});
function zoom(im){const z=$('#zoom');z.querySelector('img').src=im.src;z.querySelector('p').textContent=im.alt;z.style.display='flex'}
function buildRevision(){
  const el=$('#revision');if(!el)return;
  el.innerHTML='<div class="rev">'+DATA.filter(t=>t.subs.some(s=>s.mem)).map(t=>`<h4>${t.icon} ${TT(t).title}</h4><ul>`+t.subs.filter(s=>s.mem).map(s0=>{const s=SS(s0);return `<li><b>${s.n}</b> ${s.mem}</li>`}).join('')+'</ul>').join('')+'</div>';
}
function buildFlash(){
  const el=$('#flash');if(!el)return;const F=FL();
  el.innerHTML=F.map(([q,a],i)=>`<div class="fc" data-i="${i}">${q}</div>`).join('');
  el.querySelectorAll('.fc').forEach(c=>c.onclick=()=>{const[q,a]=F[+c.dataset.i];c.classList.toggle('flip');c.textContent=c.classList.contains('flip')?a:q});
}
let score=0,answered=0,order=QUIZ.map((_,i)=>i);
function buildQuiz(shuffle){
  const el=$('#quiz');if(!el)return;score=0;answered=0;const Q=QZ();
  if(shuffle)order.sort(()=>Math.random()-.5);
  updScore();
  el.innerHTML=order.map((qi,k)=>{const q=Q[qi];return `<div class="q" data-i="${qi}"><div class="qt">${k+1}. ${q[0]}</div>`+
    q[1].map((o,j)=>`<label><input type="radio" name="q${qi}" value="${j}"> ${o}</label>`).join('')+`<div class="exp">✅ ${q[3]}</div></div>`}).join('');
  el.querySelectorAll('.q').forEach(box=>box.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
    if(box.classList.contains('answered'))return;
    const i=+box.dataset.i,c=QUIZ[i][2],v=+inp.value;
    box.classList.add('answered');answered++;if(v===c)score++;
    box.querySelectorAll('label').forEach((l,j)=>{if(j===c)l.classList.add('right');else if(j===v)l.classList.add('wrong');l.querySelector('input').disabled=true});
    updScore();
  }));
}
function updScore(){const s=$('#score');if(!s)return;const n=QUIZ.length,wrong=answered-score;
  s.textContent=`${U('score')}: ${score} / ${answered}  · ${U('wrong')} ${wrong}`+(wrong>3?U('fail'):'')+(answered===n?(wrong<=3?U('pass'):U('again')):'')}
render();
</script>
